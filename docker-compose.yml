version: "3.9"

# ====== NETWORKS ======
networks:
  authentik_net:
    driver: overlay
    attachable: true

# ====== VOLUMES ======
volumes:
  ak_db:
  ak_redis:
  ak_media:
  ak_templates:
  ak_certs:

# ====== SERVICES ======
services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
      TZ: America/Chicago
    volumes:
      - ak_db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks:
      - authentik_net
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.authentik == true
      restart_policy:
        condition: on-failure

  redis:
    image: redis:alpine
    command: ["--save","60","1","--loglevel","warning"]
    environment:
      - TZ=America/Chicago
    volumes:
      - ak_redis:/data
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks:
      - authentik_net
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.authentik == true
      restart_policy:
        condition: on-failure

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.2}
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      TZ: America/Chicago
    networks:
      - authentik_net
    ports:
      - "10.11.101.5:9000:9000"
      - "10.11.101.5:8443:9443"
      - "10.11.101.5:636:636"
    volumes:
      - ak_media:/media
      - ak_templates:/templates
      - ak_certs:/certs
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      - redis
      - postgresql
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.authentik == true
      restart_policy:
        condition: on-failure

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.2}
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      TZ: America/Chicago
    networks:
      - authentik_net
    volumes:
      - ak_media:/media
      - ak_templates:/templates
      - ak_certs:/certs
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      - redis
      - postgresql
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.authentik == true
      restart_policy:
        condition: on-failure